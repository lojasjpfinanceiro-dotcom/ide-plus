<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda • IDE+</title><link rel="stylesheet" href="/css/app.css"><style>.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.dow{text-align:center;font-size:12px;color:#6b7f95;font-weight:700}.day{min-height:64px;border:1px solid #dbe7f1;border-radius:12px;background:#fff;padding:7px;text-align:left}.day.has{font-weight:700}.day.has::after{content:"";display:block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-top:5px}.day.sel{outline:2px solid currentColor}.event{padding:12px 0;border-bottom:1px solid #e5eef6}.event:last-child{border:0}@media(max-width:700px){.calendar{gap:4px}.day{min-height:54px;padding:5px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">IDE<b>+</b></div><nav><a href="/home.html">⌂ Início</a><a class="active" href="/agenda.html">📅 Agenda</a></nav><nav class="mobile-bottom"><a href="/home.html"><span>⌂</span><small>Início</small></a><button id="mobileMenu"><span>☰</span><small>Menu</small></button><button id="mobilePerfil"><span>👤</span><small>Perfil</small></button></nav></aside><main class="main"><h1>Agenda</h1><p>Campanhas, discipulado, aulas, visitas e demais atividades programadas.</p><section class="card panel"><div class="cal-head"><button id="prev" type="button">‹</button><h2 id="mesTitulo"></h2><button id="next" type="button">›</button></div><div class="calendar" id="calendar"></div></section><section class="card panel" style="margin-top:18px"><h2 id="diaTitulo">Programação</h2><div id="eventos">Selecione um dia.</div></section><section class="card panel" style="margin-top:18px"><h2>Nova programação</h2><form id="formAgenda"><div class="field"><label>Tipo</label><select name="modulo"><option value="CAMPANHA">Campanha</option><option value="DISCIPULADO">Discipulado / Aula / Visita</option><option value="OUTRO">Outro</option></select></div><div class="field"><label>Título *</label><input name="titulo" required placeholder="Ex.: Evangelismo na praça"></div><div class="field"><label>Data *</label><input name="data_evento" type="date" required></div><div class="field"><label>Hora inicial</label><input name="hora_inicio" type="time"></div><div class="field"><label>Hora final</label><input name="hora_fim" type="time"></div><div class="field"><label>Local</label><input name="local"></div><div class="field"><label>Responsável</label><input name="responsavel"></div><div class="field"><label>Observações</label><input name="observacoes"></div><button class="btn">Gravar programação</button><div class="msg" id="msg"></div></form></section></main></div><script src="/js/agenda.js"></script></body></html>
