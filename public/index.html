<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13294B">
  <title>IDE+ · Fazendo discípulos em todo lugar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2313294B'/><text x='16' y='22' font-size='15' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%23D9A441'>I+</text></svg>">
</head>
<body>
  <!-- Login -->
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-caixa form" novalidate>
      <div>
        <div class="marca">IDE<b>+</b></div>
        <p class="lema">Fazendo discípulos em todo lugar</p>
      </div>
      <label class="campo">E-mail
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label class="campo">Senha
        <input name="senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="erro-form" id="erro-login" hidden></p>
      <button class="botao bloco" type="submit">Entrar</button>
      <details class="ajuda"><summary>Esqueci minha senha</summary>
        <p>Peça a quem cadastrou você para definir uma nova senha. Pastores Presidentes falam com o suporte do IDE+.</p></details>
    </form>
  </main>

  <!-- App -->
  <div id="tela-app" class="app" hidden>
    <nav class="lateral" id="lateral" aria-label="Menu principal">
      <div class="marca-lateral">IDE<b>+</b></div>
      <div class="nivel-selo rotulo" id="nivel-selo"></div>
      <ul class="menu" id="menu"></ul>
      <div class="rodape-menu">
        <ul class="menu">
          <li><a href="#perfil" data-rota="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span class="rotulo">Meu perfil</span></a></li>
          <li><a href="#sair" id="sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span class="rotulo">Sair</span></a></li>
        </ul>
      </div>
    </nav>
    <div class="veu" id="veu" hidden></div>
    <div>
      <header class="topo">
        <button class="botao icone" id="abrir-menu" aria-label="Abrir ou recolher menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="logo" id="topo-logo"></div>
        <div class="den"><strong id="topo-den"></strong><small id="topo-sub"></small></div>
        <button class="avatar" id="topo-avatar" aria-label="Meu perfil"></button>
      </header>
      <main class="conteudo" id="conteudo"></main>
    </div>
  </div>

  <dialog class="modal" id="modal"></dialog>

  <script src="/js/app.js"></script>
</body>
</html>
