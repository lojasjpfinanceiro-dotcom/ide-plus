<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pessoas • IDE+</title><link rel="stylesheet" href="/css/app.css"><style>.actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.actions .btn{width:auto}.list{margin-top:18px}.person{padding:16px 0;border-bottom:1px solid #e5eef6}.person small{color:#6b7f95}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span{grid-column:1/-1}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand">IDE<b>+</b></div><nav><a href="/home.html">⌂ Início</a><a class="active" href="/pessoas.html">👤 Pessoas</a><a>📣 Evangelismo</a><a>📖 Discipulado</a><a href="/configuracao.html">⛪ Congregações</a><a>👥 Equipes</a><a>📅 Agenda</a><a>💧 Batismos</a><a>📊 Relatórios</a><a>⚙ Configurações</a></nav></aside><main class="main"><div class="actions"><div><h1>Pessoas</h1><p>Uma única ficha para acompanhar cada pessoa.</p></div><button class="btn" onclick="formBox.hidden=!formBox.hidden">＋ Nova pessoa</button></div><section class="card panel" id="formBox" hidden><h2>Nova pessoa</h2><form id="form" class="formgrid"><div class="field span"><label>Nome *</label><input name="nome" required></div><div class="field"><label>Telefone / WhatsApp</label><input name="telefone"></div><div class="field"><label>E-mail</label><input name="email" type="email"></div><div class="field"><label>Congregação</label><select name="congregacao_id" id="congregacao"><option value="">Não definida</option></select></div><div class="field"><label>Origem</label><select name="origem"><option value="">Selecione</option><option>Evangelismo de rua</option><option>Culto</option><option>Campanha</option><option>Célula / Pequeno grupo</option><option>Visita</option><option>Indicação</option><option>Redes sociais</option><option>Ação social</option><option>Outro</option></select></div><div class="field"><label>Data de nascimento</label><input name="data_nascimento" type="date"></div><div class="field"><label>Cidade</label><input name="cidade"></div><div class="field"><label>Bairro</label><input name="bairro"></div><div class="field span"><label>Endereço</label><input name="endereco"></div><div class="field span"><label>Observações</label><input name="observacoes"></div><div class="span"><button class="btn" id="salvar">Gravar pessoa</button><div class="msg" id="msg"></div></div></form></section><section class="card panel list"><div class="field"><input id="busca" placeholder="Buscar por nome, telefone ou origem..." oninput="render()"></div><div id="lista">Carregando...</div></section></main></div><script src="/js/pessoas.js"></script></body></html>
