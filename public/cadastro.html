<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta • IDE+</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth"><section class="hero"><div class="brand">IDE<b>+</b></div><h1>Comece agora.</h1><p>Crie o ambiente da sua denominação e depois configure congregações, jornadas e equipes.</p></section><section class="formwrap"><form class="card form" id="form"><h2>Crie sua conta</h2><div class="field"><label>Nome da denominação *</label><input name="denominacao" required></div><div class="field"><label>Seu nome *</label><input name="nome" required></div><div class="field"><label>E-mail *</label><input name="email" type="email" required></div><div class="field"><label>Telefone / WhatsApp</label><input name="telefone"></div><div class="field"><label>Cidade</label><input name="cidade"></div><div class="field"><label>Estado</label><input name="estado" maxlength="2"></div><div class="field"><label>Senha *</label><input name="senha" type="password" minlength="6" required></div><button class="btn">Criar conta</button><div class="msg" id="msg"></div><p>Já tem conta? <span class="link" onclick="location.href='/'">Entrar</span></p></form></section></main><script src="/js/cadastro.js"></script></body></html>
