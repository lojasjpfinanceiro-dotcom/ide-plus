<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipe • IDE+</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="shell"><main class="main">
<header class="top"><div><h1>Minha equipe</h1><p>Cadastre funções e usuários da sua equipe em Campanhas, Discipulado ou Visualização.</p></div></header>
<section class="card panel"><h2>Funções da equipe</h2><form id="formFuncao"><div class="coordenador-form-grid"><div class="field"><label>Nome da função *</label><input name="nome" placeholder="Ex.: Secretário, Professor ou Aluno" required></div><div class="field"><label>Módulo *</label><select name="modulo" required><option value="">Selecione</option><option value="CAMPANHAS">Campanhas</option><option value="DISCIPULADO">Discipulado</option><option value="GERAL">Visualização</option></select></div></div><button class="btn">Cadastrar função</button><div id="msgFuncao" class="msg"></div></form><div id="listaFuncoes"></div></section>
<section class="card panel" style="margin-top:18px"><h2>Usuários da equipe</h2><form id="formUsuarioEquipe"><div class="coordenador-form-grid"><div class="field"><label>Nome *</label><input name="nome" required></div><div class="field"><label>WhatsApp</label><input name="telefone" inputmode="tel"></div><div class="field"><label>Função *</label><select id="funcaoEquipe" name="funcao_id" required></select></div><div class="field"><label>E-mail *</label><input name="email" type="email" required></div><div class="field"><label>Senha inicial *</label><input name="senha" type="password" minlength="8" required><small>Mínimo de 8 caracteres.</small></div></div><button class="btn">Salvar e liberar acesso</button><div id="msgEquipe" class="msg"></div></form></section>
<section class="card panel" style="margin-top:18px"><h2>Pessoas da equipe</h2><div id="listaEquipe">Carregando...</div></section>
</main></div><script src="/js/coordenacao-equipe.js"></script></body></html>
