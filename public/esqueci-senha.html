<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — IDE+</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth"><section class="hero"><div class="brand">IDE<b>+</b></div><h1>Recupere seu acesso.</h1><p>Receba um código de confirmação no seu e-mail e crie uma nova senha.</p></section><section class="formwrap"><div class="card form"><div id="etapaEmail"><h2>Esqueci minha senha</h2><p>Informe o e-mail cadastrado no IDE+.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><button class="btn" onclick="enviarCodigo()">Enviar código</button></div><div id="etapaCodigo" style="display:none"><h2>Digite o código</h2><p>Enviamos um código de 6 dígitos para o e-mail informado.</p><div class="field"><label>Código de confirmação</label><input id="codigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="btn" onclick="confirmarCodigo()">Confirmar código</button><p><span class="link" onclick="enviarCodigo()">Reenviar código</span></p></div><div id="etapaSenha" style="display:none"><h2>Crie sua nova senha</h2><div class="field"><label>Nova senha</label><input id="novaSenha" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Confirmar nova senha</label><input id="confirmarSenha" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" onclick="redefinirSenha()">Alterar senha</button></div><div class="msg" id="msg"></div><p><span class="link" onclick="location.href='/'">Voltar ao login</span></p></div></section></main><script src="/js/esqueci-senha.js"></script></body></html>
