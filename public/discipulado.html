<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhamento • IDE+</title><link rel="stylesheet" href="/css/app.css"><style>
.disc-list{display:grid;gap:12px}.disc-card{width:100%;text-align:left;padding:16px;border:1px solid #dbe7f1;border-radius:16px;background:#fff}.disc-card strong{font-size:18px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;padding:5px 8px;border-radius:20px;background:#eef5fb}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wide{grid-column:1/-1}.history{padding:12px 0;border-bottom:1px solid #e5eef6}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">IDE<b>+</b></div><nav><a href="/home.html">⌂ Início</a><a class="active" href="/discipulado.html">📚 Discipulado</a></nav><nav class="mobile-bottom"><a href="/home.html"><span>⌂</span><small>Início</small></a><a href="/discipulado.html"><span>📚</span><small>Discípulos</small></a><a href="/home.html"><span>👤</span><small>Perfil</small></a></nav></aside><main class="main">
<h1>Acompanhamento do discipulado</h1><p>Veja em que etapa cada pessoa está e o que precisa acontecer em seguida.</p>
<section class="card panel"><h2>Discípulos em acompanhamento</h2><div id="lista" class="disc-list">Carregando...</div></section>
<section id="detalhe" class="card panel" style="display:none;margin-top:18px"><h2 id="nome"></h2><p id="contexto"></p>
<form id="formAcompanhamento" class="detail-grid"><div class="field"><label>Nível / etapa</label><select name="nivel"><option value="INICIO">Início</option><option value="VISITAS">Visitas e vínculo</option><option value="AULAS">Aulas de discipulado</option><option value="CONSOLIDACAO">Consolidação</option><option value="PREPARACAO_BATISMO">Preparação para batismo</option></select></div>
<div class="field"><label>Situação atual</label><select name="situacao"><option value="ATIVO">Ativo</option><option value="PAUSADO">Pausado</option><option value="ATENCAO">Precisa de atenção</option><option value="CONCLUIDO">Concluído</option></select></div>
<div class="field"><label>Onde está estudando</label><input name="local_estudo" placeholder="Congregação, casa, célula..."></div><div class="field"><label>Próxima data</label><input type="date" name="proxima_data"></div>
<div class="field wide"><label>Próxima ação</label><input name="proxima_acao" placeholder="Ex.: realizar visita, aula 3, conversar com a família"></div><div class="field wide"><label>Observações</label><textarea name="observacoes"></textarea></div>
<button class="btn">Salvar acompanhamento</button><div id="msg"></div></form>
<hr><h3>Registrar visita</h3><form id="formVisita" class="detail-grid"><div class="field"><label>Data</label><input type="date" name="data_visita"></div><div class="field"><label>Tipo</label><select name="tipo"><option>ACOMPANHAMENTO</option><option>DOMICILIAR</option><option>HOSPITALAR</option><option>FAMILIAR</option></select></div><div class="field"><label>Responsável</label><input name="responsavel"></div><div class="field"><label>Situação encontrada</label><input name="situacao_encontrada"></div><div class="field wide"><label>Resumo da visita</label><textarea name="resumo"></textarea></div><button class="btn">Registrar visita</button></form>
<h3>Histórico de visitas</h3><div id="historico"></div></section></main></div><script src="/js/discipulado.js"></script></body></html>
