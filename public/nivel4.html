<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>IDE+ Professor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0F1419;
      color: #E8EBF0;
    }
    #root { width: 100%; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============ API ============
    async function api(path) {
      const token = localStorage.getItem('ide_token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`/api${path}`, { headers });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // ============ HEADER ============
    function Header({ usuario }) {
      return (
        <div style={styles.header}>
          <div style={styles.headerTop}>
            <div style={styles.headerLogo}>
              <div style={styles.logo}>📖</div>
            </div>
            <div style={styles.headerUser}>
              <img 
                src={`https://ui-avatars.com/api/?name=${encodeURIComponent(usuario?.nome || 'P')}&bg=7C3AED&color=fff&bold=true`}
                style={styles.avatar}
              />
            </div>
          </div>
          <div style={styles.headerInfo}>
            <h1 style={styles.headerName}>{usuario?.nome}</h1>
            <p style={styles.headerRole}>{usuario?.cargo} • {usuario?.congregacao}</p>
          </div>
        </div>
      );
    }

    // ============ ABAS ============
    function Tabs({ ativa, onChange }) {
      const tabs = [
        { id: 1, label: 'Meus planos' },
        { id: 2, label: 'Dar aula' },
        { id: 3, label: 'Andamento' }
      ];
      return (
        <div style={styles.tabs}>
          {tabs.map(t => (
            <button
              key={t.id}
              onClick={() => onChange(t.id)}
              style={{
                ...styles.tab,
                backgroundColor: ativa === t.id ? '#7C3AED' : '#1E2635',
                color: ativa === t.id ? '#FFF' : '#8A8F99'
              }}
            >
              {t.id} {t.label}
            </button>
          ))}
        </div>
      );
    }

    // ============ CARD EXPANDÍVEL ============
    function CardPlano({ titulo, descricao, modulos, aulas, duracao, config, onUsar }) {
      const [expandido, setExpandido] = useState(false);
      
      return (
        <div style={styles.cardPlano}>
          <div style={styles.cardPlanoHeader} onClick={() => setExpandido(!expandido)}>
            <div>
              <h3 style={styles.cardPlanoTitulo}>{titulo}</h3>
              <p style={styles.cardPlanoDesc}>{descricao}</p>
              <div style={styles.cardPlanoMeta}>
                <span>{modulos} módulos</span>
                <span>•</span>
                <span>{aulas} aulas</span>
                <span>•</span>
                <span>{duracao}</span>
              </div>
            </div>
            <div style={styles.expandIcon}>{expandido ? '▼' : '▶'}</div>
          </div>

          {expandido && (
            <div style={styles.cardPlanoContent}>
              <div style={styles.section}>
                <h4 style={styles.sectionTitle}>📚 {modulos} Módulos</h4>
                <p style={styles.sectionAction}>clique para expandir</p>
              </div>

              <div style={styles.section}>
                <h4 style={styles.sectionTitle}>⚙️ Configurações da prova</h4>
                <p style={styles.sectionAction}>clique para expandir</p>
              </div>

              <button style={styles.btnUsar} onClick={onUsar}>
                ✓ Usar nesta turma
              </button>
            </div>
          )}
        </div>
      );
    }

    // ============ ABA 1: MEUS PLANOS ============
    function AbaMeusPlanos() {
      const [planos, setPlanos] = useState([]);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        async function carregar() {
          try {
            const data = await api('/discipulado/curriculos');
            setPlanos(data.curriculos || []);
          } catch (e) {
            console.error('Erro:', e);
          } finally {
            setCarregando(false);
          }
        }
        carregar();
      }, []);

      if (carregando) return <div style={styles.loading}>Carregando planos...</div>;

      return (
        <div style={styles.abContent}>
          <h2 style={styles.abTitle}>Meus planos de aula</h2>
          
          <div style={styles.planosList}>
            {planos.length === 0 ? (
              <p style={styles.vazio}>Nenhum plano disponível</p>
            ) : (
              planos.map(p => (
                <CardPlano
                  key={p.id}
                  titulo={p.nome}
                  descricao={p.descricao || 'Sem descrição'}
                  modulos={p.modulos || 0}
                  aulas={p.licoes || 0}
                  duracao={p.duracao || '4h40'}
                  config={{ notaMinima: p.nota_minima, frequenciaMinima: p.frequencia_minima }}
                  onUsar={() => alert('Plano selecionado: ' + p.nome)}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    // ============ ABA 2: DAR AULA ============
    function AbadarAula() {
      const [turmas, setTurmas] = useState([]);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        async function carregar() {
          try {
            const data = await api('/nivel4/turmas');
            setTurmas(data.turmas || []);
          } catch (e) {
            console.error('Erro:', e);
          } finally {
            setCarregando(false);
          }
        }
        carregar();
      }, []);

      if (carregando) return <div style={styles.loading}>Carregando turmas...</div>;

      return (
        <div style={styles.abContent}>
          <h2 style={styles.abTitle}>Dar aula</h2>
          
          <div style={styles.aulasList}>
            {turmas.length === 0 ? (
              <p style={styles.vazio}>Nenhuma turma disponível</p>
            ) : (
              turmas.map(t => (
                <div key={t.id} style={styles.cardAula}>
                  <h3 style={styles.cardAulaTitulo}>{t.nome}</h3>
                  <p style={styles.cardAulaInfo}>👥 {t.total_alunos} alunos</p>
                  <div style={styles.botoesAula}>
                    <button style={styles.btnForma}>▶ Slide presencial</button>
                    <button style={styles.btnForma}>📖 Revista presencial</button>
                    <button style={styles.btnForma}>● Live online</button>
                  </div>
                  <div style={styles.botoesAcao}>
                    <button style={styles.btnSecundario}>Confirmar aula</button>
                    <button style={styles.btnSecundario}>Ver prova</button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============ ABA 3: ANDAMENTO ============
    function AbaAndamento() {
      const [turmas, setTurmas] = useState([]);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        async function carregar() {
          try {
            const data = await api('/nivel4/turmas');
            setTurmas(data.turmas || []);
          } catch (e) {
            console.error('Erro:', e);
          } finally {
            setCarregando(false);
          }
        }
        carregar();
      }, []);

      if (carregando) return <div style={styles.loading}>Carregando andamento...</div>;

      return (
        <div style={styles.abContent}>
          <h2 style={styles.abTitle}>Andamento</h2>
          
          <div style={styles.andamentoList}>
            {turmas.length === 0 ? (
              <p style={styles.vazio}>Nenhuma turma em andamento</p>
            ) : (
              turmas.map(t => (
                <div key={t.id} style={styles.cardAndamento}>
                  <h3 style={styles.cardAndamentoTitulo}>{t.nome}</h3>
                  <div style={styles.stats}>
                    <div style={styles.stat}>
                      <span style={styles.statLabel}>Aulas</span>
                      <span style={styles.statValue}>8/12</span>
                    </div>
                    <div style={styles.stat}>
                      <span style={styles.statLabel}>Alunos</span>
                      <span style={styles.statValue}>{t.total_alunos}</span>
                    </div>
                    <div style={styles.stat}>
                      <span style={styles.statLabel}>Presença</span>
                      <span style={styles.statValue}>87%</span>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============ APP PRINCIPAL ============
    function App() {
      const [abaAtiva, setAbaAtiva] = useState(1);
      const [usuario, setUsuario] = useState({
        nome: 'Pr Ailton',
        cargo: 'Líder / Equipe',
        congregacao: 'Joaquim Nabuco'
      });

      return (
        <div style={styles.app}>
          <Header usuario={usuario} />
          <Tabs ativa={abaAtiva} onChange={setAbaAtiva} />
          
          {abaAtiva === 1 && <AbaMeusPlanos />}
          {abaAtiva === 2 && <AbadarAula />}
          {abaAtiva === 3 && <AbaAndamento />}
        </div>
      );
    }

    // ============ ESTILOS ============
    const styles = {
      app: {
        width: '100%',
        minHeight: '100vh',
        background: '#0F1419',
        color: '#E8EBF0',
        paddingBottom: '40px'
      },
      header: {
        background: '#1A1F2E',
        padding: '16px',
        borderBottom: '1px solid #2A3142'
      },
      headerTop: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginBottom: '16px'
      },
      headerLogo: {
        fontSize: '24px'
      },
      logo: {
        width: '48px',
        height: '48px',
        borderRadius: '8px',
        background: '#2A3142',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: '24px'
      },
      avatar: {
        width: '40px',
        height: '40px',
        borderRadius: '50%'
      },
      headerInfo: {
        paddingLeft: '0'
      },
      headerName: {
        fontSize: '18px',
        fontWeight: '700',
        margin: '0 0 4px 0'
      },
      headerRole: {
        fontSize: '12px',
        color: '#8A8F99',
        margin: 0
      },
      tabs: {
        display: 'grid',
        gridTemplateColumns: '1fr 1fr 1fr',
        gap: '8px',
        padding: '12px',
        background: '#0F1419',
        borderBottom: '1px solid #2A3142'
      },
      tab: {
        padding: '10px 12px',
        border: 'none',
        borderRadius: '8px',
        fontSize: '13px',
        fontWeight: '600',
        cursor: 'pointer',
        transition: 'all 0.2s'
      },
      abContent: {
        padding: '16px'
      },
      abTitle: {
        fontSize: '16px',
        fontWeight: '700',
        margin: '0 0 16px 0'
      },
      planosList: {
        display: 'grid',
        gap: '12px'
      },
      cardPlano: {
        background: '#1A1F2E',
        borderRadius: '8px',
        overflow: 'hidden',
        border: '1px solid #2A3142'
      },
      cardPlanoHeader: {
        padding: '16px',
        cursor: 'pointer',
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'start',
        gap: '12px'
      },
      cardPlanoTitulo: {
        fontSize: '15px',
        fontWeight: '700',
        margin: '0 0 4px 0'
      },
      cardPlanoDesc: {
        fontSize: '12px',
        color: '#8A8F99',
        margin: '0 0 8px 0'
      },
      cardPlanoMeta: {
        fontSize: '11px',
        color: '#7A7F88',
        display: 'flex',
        gap: '6px',
        flexWrap: 'wrap'
      },
      expandIcon: {
        fontSize: '12px',
        color: '#7A7F88',
        flexShrink: 0
      },
      cardPlanoContent: {
        padding: '0 16px 16px 16px',
        borderTop: '1px solid #2A3142',
        background: '#141822'
      },
      section: {
        marginBottom: '12px',
        paddingBottom: '12px',
        borderBottom: '1px solid #2A3142'
      },
      sectionTitle: {
        fontSize: '13px',
        fontWeight: '600',
        margin: '0 0 6px 0'
      },
      sectionAction: {
        fontSize: '11px',
        color: '#7A7F88',
        margin: 0
      },
      btnUsar: {
        width: '100%',
        padding: '12px',
        background: '#7C3AED',
        color: '#FFF',
        border: 'none',
        borderRadius: '6px',
        fontSize: '14px',
        fontWeight: '600',
        cursor: 'pointer',
        marginTop: '4px'
      },
      aulasList: {
        display: 'grid',
        gap: '12px'
      },
      cardAula: {
        background: '#1A1F2E',
        borderRadius: '8px',
        padding: '16px',
        border: '1px solid #2A3142'
      },
      cardAulaTitulo: {
        fontSize: '15px',
        fontWeight: '700',
        margin: '0 0 8px 0'
      },
      cardAulaInfo: {
        fontSize: '12px',
        color: '#8A8F99',
        margin: '0 0 12px 0'
      },
      botoesAula: {
        display: 'grid',
        gap: '8px',
        marginBottom: '12px'
      },
      btnForma: {
        padding: '10px',
        background: '#2A3142',
        color: '#E8EBF0',
        border: '1px solid #3A424F',
        borderRadius: '6px',
        fontSize: '12px',
        fontWeight: '500',
        cursor: 'pointer'
      },
      botoesAcao: {
        display: 'grid',
        gridTemplateColumns: '1fr 1fr',
        gap: '8px'
      },
      btnSecundario: {
        padding: '10px',
        background: '#2A3142',
        color: '#E8EBF0',
        border: '1px solid #3A424F',
        borderRadius: '6px',
        fontSize: '12px',
        fontWeight: '500',
        cursor: 'pointer'
      },
      andamentoList: {
        display: 'grid',
        gap: '12px'
      },
      cardAndamento: {
        background: '#1A1F2E',
        borderRadius: '8px',
        padding: '16px',
        border: '1px solid #2A3142'
      },
      cardAndamentoTitulo: {
        fontSize: '15px',
        fontWeight: '700',
        margin: '0 0 12px 0'
      },
      stats: {
        display: 'grid',
        gridTemplateColumns: '1fr 1fr 1fr',
        gap: '12px'
      },
      stat: {
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center'
      },
      statLabel: {
        fontSize: '11px',
        color: '#8A8F99',
        marginBottom: '4px'
      },
      statValue: {
        fontSize: '18px',
        fontWeight: '700'
      },
      loading: {
        padding: '40px 16px',
        textAlign: 'center',
        color: '#8A8F99',
        fontSize: '14px'
      },
      vazio: {
        padding: '24px 16px',
        textAlign: 'center',
        color: '#8A8F99',
        fontSize: '13px'
      }
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
