<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>IDE+ Professor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0F1419;
      color: #E8EBF0;
    }
    #root { width: 100%; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============ API ============
    async function api(path) {
      const token = localStorage.getItem('ide_token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`/api${path}`, { headers });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // ============ HEADER ============
    function Header({ usuario }) {
      return (
        <div style={styles.header}>
          <div style={styles.headerTop}>
            <div style={styles.headerLogo}>
              <div style={styles.logo}>📖</div>
            </div>
            <div style={styles.headerUser}>
              <img 
                src={`https://ui-avatars.com/api/?name=${encodeURIComponent(usuario?.nome || 'P')}&bg=7C3AED&color=fff&bold=true`}
                style={styles.avatar}
              />
            </div>
          </div>
          <div style={styles.headerInfo}>
            <h1 style={styles.headerName}>{usuario?.nome}</h1>
            <p style={styles.headerRole}>{usuario?.cargo} • {usuario?.congregacao}</p>
          </div>
        </div>
      );
    }

    // ============ ABAS ============
    function Tabs({ ativa, onChange }) {
      const tabs = [
        { id: 1, label: 'Meus planos' },
        { id: 2, label: 'Dar aula' },
        { id: 3, label: 'Andamento' }
      ];
      return (
        <div style={styles.tabs}>
          {tabs.map(t => (
            <button
              key={t.id}
              onClick={() => onChange(t.id)}
              style={{
                ...styles.tab,
                backgroundColor: ativa === t.id ? '#7C3AED' : '#1E2635',
                color: ativa === t.id ? '#FFF' : '#8A8F99'
              }}
            >
              {t.id} {t.label}
            </button>
          ))}
        </div>
      );
    }

    // ============ ABA 1: MEUS PLANOS ============
    function AbaMeusPlanos() {
      const [planos, setPlanos] = useState([]);
      const [carregando, setCarregando] = useState(true);
      const [expandido, setExpandido] = useState(null);
      const [editandoConfig, setEditandoConfig] = useState(null);
      const [configEditada, setConfigEditada] = useState({});
      const [salvando, setSalvando] = useState(false);

      useEffect(() => {
        async function carregar() {
          try {
            const data = await api('/discipulado/curriculos');
            setPlanos(data.curriculos || []);
          } catch (e) {
            console.error('Erro:', e);
          } finally {
            setCarregando(false);
          }
        }
        carregar();
      }, []);

      const abrirEdicao = (plano) => {
        setEditandoConfig(plano.id);
        setConfigEditada({
          nota_minima: plano.nota_minima || 70,
          frequencia_minima: plano.frequencia_minima || 75,
          tentativas_prova: plano.tentativas_prova || 2
        });
      };

      const salvarConfig = async (planoId) => {
        setSalvando(true);
        try {
          const resp = await fetch(`/api/discipulado/curriculos/${planoId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(configEditada)
          });
          if (!resp.ok) throw new Error('Erro ao salvar');
          
          // Atualizar estado local
          setPlanos(planos.map(p => 
            p.id === planoId ? { ...p, ...configEditada } : p
          ));
          setEditandoConfig(null);
          alert('Configurações salvas com sucesso!');
        } catch (e) {
          console.error('Erro:', e);
          alert('Erro ao salvar configurações');
        } finally {
          setSalvando(false);
        }
      };

      if (carregando) return <div style={styles.loading}>Carregando planos...</div>;

      return (
        <div style={styles.abContent}>
          {/* Cabeçalho didático */}
          <div style={styles.headerPlanos}>
            <h2 style={styles.titlePlanos}>Escolha seu plano de aula</h2>
            <p style={styles.subtitlePlanos}>
              Cada plano é pré-estruturado com módulos, aulas e avaliação. 
              Veja todos os detalhes e configure conforme sua necessidade.
            </p>
          </div>

          {/* Cards de planos */}
          <div style={styles.planosGrid}>
            {planos.length === 0 ? (
              <p style={styles.vazio}>Nenhum plano disponível</p>
            ) : (
              planos.map((p, idx) => (
                <div key={p.id} style={styles.cardPlanoExpandido}>
                  {/* Header do card - clicável */}
                  <div 
                    style={styles.cardHeader}
                    onClick={() => setExpandido(expandido === p.id ? null : p.id)}
                  >
                    <div style={styles.cardHeaderInfo}>
                      <div style={styles.cardNumero}>
                        <span style={styles.numero}>{idx + 1}</span>
                      </div>
                      <div>
                        <h3 style={styles.cardTituloGrande}>{p.nome}</h3>
                        <p style={styles.cardDescricaoPrevia}>{p.descricao?.substring(0, 60)}...</p>
                        <div style={styles.cardMetasPrevia}>
                          <span style={styles.metatag}>📚 Módulos</span>
                          <span style={styles.metatag}>✓ Avaliação</span>
                          <span style={styles.metatag}>⏱ 4h40</span>
                        </div>
                      </div>
                    </div>
                    <div style={styles.expandIconGrande}>
                      {expandido === p.id ? '▼' : '▶'}
                    </div>
                  </div>

                  {/* Conteúdo expandido */}
                  {expandido === p.id && (
                    <div style={styles.cardConteudo}>
                      {/* Descrição completa */}
                      <div style={styles.secao}>
                        <h4 style={styles.secaoTitulo}>📖 Sobre este plano</h4>
                        <p style={styles.secaoTexto}>{p.descricao || 'Sem descrição'}</p>
                      </div>

                      {/* Estrutura */}
                      <div style={styles.secao}>
                        <h4 style={styles.secaoTitulo}>📚 Estrutura do plano</h4>
                        <div style={styles.estrutura}>
                          <div style={styles.estruturaItem}>
                            <span style={styles.estruturaLabel}>Módulos</span>
                            <span style={styles.estruturaValor}>2</span>
                          </div>
                          <div style={styles.estruturaItem}>
                            <span style={styles.estruturaLabel}>Aulas</span>
                            <span style={styles.estruturaValor}>6</span>
                          </div>
                          <div style={styles.estruturaItem}>
                            <span style={styles.estruturaLabel}>Duração total</span>
                            <span style={styles.estruturaValor}>4h40</span>
                          </div>
                        </div>
                      </div>

                      {/* Configurações da prova - EDITÁVEL */}
                      <div style={styles.secao}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                          <h4 style={styles.secaoTitulo}>⚙️ Configurações da avaliação</h4>
                          {editandoConfig !== p.id && (
                            <button 
                              style={styles.btnEditarConfig}
                              onClick={() => abrirEdicao(p)}
                            >
                              ✏️ Editar
                            </button>
                          )}
                        </div>

                        {editandoConfig === p.id ? (
                          // Modo edição
                          <div style={styles.configEditavel}>
                            <div style={styles.campoEditavel}>
                              <label style={styles.labelEditavel}>Nota mínima para aprovação (%)</label>
                              <div style={styles.inputGroup}>
                                <input
                                  type="number"
                                  min="0"
                                  max="100"
                                  value={configEditada.nota_minima}
                                  onChange={(e) => setConfigEditada({...configEditada, nota_minima: parseInt(e.target.value)})}
                                  style={styles.inputEditavel}
                                />
                                <span style={styles.unidade}>%</span>
                              </div>
                            </div>

                            <div style={styles.campoEditavel}>
                              <label style={styles.labelEditavel}>Presença mínima (%)</label>
                              <div style={styles.inputGroup}>
                                <input
                                  type="number"
                                  min="0"
                                  max="100"
                                  value={configEditada.frequencia_minima}
                                  onChange={(e) => setConfigEditada({...configEditada, frequencia_minima: parseInt(e.target.value)})}
                                  style={styles.inputEditavel}
                                />
                                <span style={styles.unidade}>%</span>
                              </div>
                            </div>

                            <div style={styles.campoEditavel}>
                              <label style={styles.labelEditavel}>Tentativas na prova</label>
                              <div style={styles.inputGroup}>
                                <input
                                  type="number"
                                  min="1"
                                  max="10"
                                  value={configEditada.tentativas_prova}
                                  onChange={(e) => setConfigEditada({...configEditada, tentativas_prova: parseInt(e.target.value)})}
                                  style={styles.inputEditavel}
                                />
                              </div>
                            </div>

                            <div style={styles.botoesEdicao}>
                              <button 
                                style={styles.btnSalvarConfig}
                                onClick={() => salvarConfig(p.id)}
                                disabled={salvando}
                              >
                                {salvando ? '⏳ Salvando...' : '✓ Salvar configurações'}
                              </button>
                              <button 
                                style={styles.btnCancelarConfig}
                                onClick={() => setEditandoConfig(null)}
                              >
                                ✕ Cancelar
                              </button>
                            </div>
                          </div>
                        ) : (
                          // Modo visualização
                          <div style={styles.config}>
                            <div style={styles.configItem}>
                              <label style={styles.configLabel}>Nota mínima para aprovação</label>
                              <div style={styles.configValor}>{p.nota_minima}%</div>
                            </div>
                            <div style={styles.configItem}>
                              <label style={styles.configLabel}>Presença mínima</label>
                              <div style={styles.configValor}>{p.frequencia_minima}%</div>
                            </div>
                            <div style={styles.configItem}>
                              <label style={styles.configLabel}>Tentativas na prova</label>
                              <div style={styles.configValor}>{p.tentativas_prova} tentativas</div>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Como implementar */}
                      <div style={styles.secao}>
                        <h4 style={styles.secaoTitulo}>🚀 Como implementar</h4>
                        <ol style={styles.passos}>
                          <li style={styles.passo}>
                            <strong>Selecione o plano</strong> — Clique no botão "Usar nesta turma" abaixo
                          </li>
                          <li style={styles.passo}>
                            <strong>Crie sua turma</strong> — Defina nome, datas e horários
                          </li>
                          <li style={styles.passo}>
                            <strong>Inscreva os alunos</strong> — Adicione os participantes
                          </li>
                          <li style={styles.passo}>
                            <strong>Inicie as aulas</strong> — Marque presença e execute as lições
                          </li>
                          <li style={styles.passo}>
                            <strong>Realize a avaliação</strong> — Aplique a prova final
                          </li>
                          <li style={styles.passo}>
                            <strong>Emita o diploma</strong> — Gere o certificado automático
                          </li>
                        </ol>
                      </div>

                      {/* Botão de ação */}
                      <button 
                        style={styles.btnUsarGrande}
                        onClick={() => alert('Plano "' + p.nome + '" selecionado! Criar turma agora?')}
                      >
                        ✓ Usar nesta turma
                      </button>
                    </div>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============ ABA 2: DAR AULA ============
    function AbadarAula() {
      const [turmas, setTurmas] = useState([]);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        async function carregar() {
          try {
            const data = await api('/nivel4/turmas');
            setTurmas(data.turmas || []);
          } catch (e) {
            console.error('Erro:', e);
          } finally {
            setCarregando(false);
          }
        }
        carregar();
      }, []);

      if (carregando) return <div style={styles.loading}>Carregando turmas...</div>;

      return (
        <div style={styles.abContent}>
          <h2 style={styles.abTitle}>Dar aula</h2>
          
          <div style={styles.aulasList}>
            {turmas.length === 0 ? (
              <p style={styles.vazio}>Nenhuma turma disponível</p>
            ) : (
              turmas.map(t => (
                <div key={t.id} style={styles.cardAula}>
                  <h3 style={styles.cardAulaTitulo}>{t.nome}</h3>
                  <p style={styles.cardAulaInfo}>👥 {t.total_alunos} alunos</p>
                  <div style={styles.botoesAula}>
                    <button style={styles.btnForma}>▶ Slide presencial</button>
                    <button style={styles.btnForma}>📖 Revista presencial</button>
                    <button style={styles.btnForma}>● Live online</button>
                  </div>
                  <div style={styles.botoesAcao}>
                    <button style={styles.btnSecundario}>Confirmar aula</button>
                    <button style={styles.btnSecundario}>Ver prova</button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============ ABA 3: ANDAMENTO ============
    function AbaAndamento() {
      const [turmas, setTurmas] = useState([]);
      const [carregando, setCarregando] = useState(true);

      useEffect(() => {
        async function carregar() {
          try {
            const data = await api('/nivel4/turmas');
            setTurmas(data.turmas || []);
          } catch (e) {
            console.error('Erro:', e);
          } finally {
            setCarregando(false);
          }
        }
        carregar();
      }, []);

      if (carregando) return <div style={styles.loading}>Carregando andamento...</div>;

      return (
        <div style={styles.abContent}>
          <h2 style={styles.abTitle}>Andamento</h2>
          
          <div style={styles.andamentoList}>
            {turmas.length === 0 ? (
              <p style={styles.vazio}>Nenhuma turma em andamento</p>
            ) : (
              turmas.map(t => (
                <div key={t.id} style={styles.cardAndamento}>
                  <h3 style={styles.cardAndamentoTitulo}>{t.nome}</h3>
                  <div style={styles.stats}>
                    <div style={styles.stat}>
                      <span style={styles.statLabel}>Aulas</span>
                      <span style={styles.statValue}>8/12</span>
                    </div>
                    <div style={styles.stat}>
                      <span style={styles.statLabel}>Alunos</span>
                      <span style={styles.statValue}>{t.total_alunos}</span>
                    </div>
                    <div style={styles.stat}>
                      <span style={styles.statLabel}>Presença</span>
                      <span style={styles.statValue}>87%</span>
                    </div>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ============ APP PRINCIPAL ============
    function App() {
      const [abaAtiva, setAbaAtiva] = useState(1);
      const [usuario, setUsuario] = useState({
        nome: 'Pr Ailton',
        cargo: 'Líder / Equipe',
        congregacao: 'Joaquim Nabuco'
      });

      return (
        <div style={styles.app}>
          <Header usuario={usuario} />
          <Tabs ativa={abaAtiva} onChange={setAbaAtiva} />
          
          {abaAtiva === 1 && <AbaMeusPlanos />}
          {abaAtiva === 2 && <AbadarAula />}
          {abaAtiva === 3 && <AbaAndamento />}
        </div>
      );
    }

    // ============ ESTILOS ============

      },

        fontSize: '24px'
      },
      logo: {
        width: '48px',

      headerPlanos: {
