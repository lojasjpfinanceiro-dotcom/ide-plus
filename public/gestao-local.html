<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão Local • IDE+</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="shell"><aside class="side"><div class="brand">IDE<b>+</b></div><nav><a href="/home.html">⌂ Início</a><a href="/estrutura.html">🏙 Estrutura</a><a class="active">⛪ Gestão local</a></nav></aside><main class="main"><h1>Gestão Local</h1><p>Congregações da sua cidade. Este cadastro não pertence ao nível da Presidência.</p><div class="grid"><form class="card panel" id="form"><h2>Nova congregação</h2><div class="field"><label>Nome *</label><input name="nome" required></div><div class="field"><label>Tipo *</label><select name="tipo"><option value="SEDE_LOCAL">Sede local</option><option value="CONGREGACAO">Congregação</option></select></div><div class="field"><label>Endereço</label><input name="endereco"></div><button class="btn">Gravar</button><div class="msg" id="msg"></div></form><section class="card panel"><h2>Congregações</h2><div id="lista">Carregando...</div></section></div></main></div><script>const token=localStorage.getItem('ide_token'),u=JSON.parse(localStorage.getItem('ide_usuario')||'{}');if(!token)location.href='/';if(String(u.escopo||'').toUpperCase()!=='CIDADE')location.href='/estrutura.html';const h={'Content-Type':'application/json','Authorization':'Bearer '+token};async function load(){const r=await fetch('/api/congregacoes',{headers:h}),d=await r.json();lista.innerHTML=d.length?d.map(x=>'<p><strong>'+x.nome+'</strong><br><small>'+[x.cidade,x.estado].filter(Boolean).join(' / ')+'</small></p>').join(''):'Nenhuma congregação cadastrada.'}form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Gravando...';const o=Object.fromEntries(new FormData(form));const r=await fetch('/api/congregacoes',{method:'POST',headers:h,body:JSON.stringify(o)}),d=await r.json();msg.textContent=r.ok?'Gravado com sucesso.':d.erro;if(r.ok){form.reset();await load();}});load();</script></body></html>
