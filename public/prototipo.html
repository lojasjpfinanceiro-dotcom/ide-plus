  if(D.grn){const old=D.grn,nw=b.closest('.lk').querySelector('.gxn').value.trim();
    if(nw===old)return;if(nw.length<3){toast('Informe o nome da congregação.');return}
    if(allC().some(C=>C.gs.some(y=>y.toLowerCase()===nw.toLowerCase()))){toast('Já existe uma congregação com esse nome.');return}
    gRen(old,nw);render(1);toast('Congregação renomeada. Pessoas, turmas e campanhas já aparecem com o novo nome.')}
  else if(D.gdel){const g=D.gdel,s=b.closest('details').querySelector('.gxt');GDEL={g,to:s?s.value:''};render(1)}
  else if(D.gdelx){GDEL=null;render(1)}
  else if(D.gdel2){const {g,to}=GDEL,C=cidDe(g),np=PS.filter(p=>p.c===g).length;
    if(to){PS.forEach(p=>{if(p.c===g)p.c=to});TU.forEach(u=>{if(u.g===g)u.g=to})}
    CP.forEach(c=>{if(c.ab===g)c.ab='Toda a cidade'});
    C.gs.splice(C.gs.indexOf(g),1);delete CI[g];if(MYC===g)MYC=to||C.gs[0];GDEL=null;render(1);
    toast(`Congregação excluída${np?`. ${np} ${np===1?'pessoa foi transferida':'pessoas foram transferidas'} para ${to}`:''}.`)}
},true);

const opn=key=>DX===key?' open':'';
const nomeUsado=(n,self)=>US.some(u=>u!==self&&u.n.toLowerCase()===n.toLowerCase())||(ME[1].n||'').toLowerCase()===n.toLowerCase();

/* Pessoas */
function pForm(p,i){
  const cs=scopeG();
  return `<details class="f fi2"${opn('p:'+i)}><summary class="p">Alterar ou excluir</summary>
  <label>Nome completo</label><input class="en" value="${esc(p.n)}">
  <div class="c2"><div><label>Telefone</label><input class="etel" type="tel" value="${esc(p.tel||'')}"></div><div><label>CPF (opcional)</label><input class="ecpf" inputmode="numeric" maxlength="14" value="${esc(p.cpf||'')}"></div></div>
  <div class="c2"><div><label>Congregação</label><select class="econg">${[...new Set([p.c,...cs])].map(c=>`<option${c===p.c?' selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Como chegou</label><select class="eorig">${[...new Set([p.o,...lista('orig')].filter(Boolean))].map(o=>`<option${o===p.o?' selected':''}>${esc(o)}</option>`).join('')}</select></div></div>
  <div class="c3"><div><label>Rua</label><input class="erua" value="${esc(p.rua||'')}"></div><div><label>Número</label><input class="enum" value="${esc(p.num||'')}"></div></div>
  <div class="c2"><div><label>Bairro</label><input class="ebai" value="${esc(p.bai||'')}"></div><div><label>Complemento</label><input class="ecom" value="${esc(p.com||'')}"></div></div>
  <label>Observação</label><textarea class="eobs" rows="2">${esc(p.obs||'')}</textarea>
  <label>Etapa</label><select class="est">${ST.map((s,k)=>`<option value="${k}"${k===p.st?' selected':''}>${s}</option>`).join('')}</select>
  ${p.f?'<label class="ck"><input type="checkbox" class="efx"> Remover a foto</label>':''}
  <div class="err" role="alert"></div><button class="btn" data-pe="${i}">Salvar alterações</button>
  ${lv<=2?dxArea('p:'+i,'Excluir pessoa',`Excluir ${esc(p.n)}?`,'Todo o histórico de discipulado e visitas desta pessoa será apagado.'):''}</details>`;
}
function pCheck(o,self){
  const er=[];
  if(o.n.length<3||!/\s/.test(o.n))er.push('Informe o nome completo (nome e sobrenome).');
  if(o.tel&&o.tel.replace(/\D/g,'').length<10)er.push('O telefone precisa ter DDD e número.');
  if(o.cpf&&!cpfOk(o.cpf))er.push('Este CPF não é válido. Confira os números.');
  else if(o.cpf&&PS.some(p=>p!==self&&p.cpf===o.cpf))er.push('Já existe uma pessoa cadastrada com este CPF.');
  if(o.num&&!o.rua)er.push('Informe a rua do endereço.');
  return er;
}

  return `<details class="f fi2"${opn('u:'+i)}><summary class="p">Alterar ou excluir</summary>

}
function uRen(old,nw){allC().forEach(C=>{if(C.pg===old)C.pg=nw});Object.values(CI).forEach(x=>{if(x.resp===old)x.resp=nw});allC().forEach(C=>{if(C.gst&&C.gst.n===old)C.gst.n=nw});TU.forEach(t=>{if(t.pr===old)t.pr=nw})}

/* País, estado e cidade */
function geoForm(kind,key,nome,info){
  const lbl={pa:'país',es:'estado',ci:'cidade'}[kind];
  return `<details class="f gx"${opn(kind+':'+key)}><summary class="p">Alterar ou excluir ${lbl}</summary><div class="lk" style="margin-top:6px"><input class="gnn" value="${esc(nome)}" aria-label="Nome do ${lbl}"><button class="sm" data-geo="${kind}:${key}">Renomear</button></div>${info}</details>`;
}
function geoDel(kind,key){
  const k=key.split(':').map(Number);
  if(kind==='pa'){const P=GEO[k[0]];return P.es.length?`<p class="p" style="margin:8px 0 0">Para excluir o país, exclua antes os ${P.es.length} ${P.es.length===1?'estado':'estados'} dele.</p>`:dxArea('pa:'+key,'Excluir país',`Excluir ${esc(P.p)}?`,'')}
  if(kind==='es'){const E=GEO[k[0]].es[k[1]];return E.cs.length?`<p class="p" style="margin:8px 0 0">Para excluir o estado, exclua antes as ${E.cs.length} ${E.cs.length===1?'cidade':'cidades'} dele.</p>`:dxArea('es:'+key,'Excluir estado',`Excluir ${esc(E.e)}?`,'')}
  const C=GEO[k[0]].es[k[1]].cs[k[2]];
  if(C.sede)return '<p class="p" style="margin:8px 0 0">É a cidade sede. Para excluí-la, defina antes outra cidade como sede.</p>';
  const np=PS.filter(p=>C.gs.includes(p.c)).length,nt=TU.filter(t=>C.gs.includes(t.g)).length,nc=CP.filter(c=>c.ci===C.c).length;
  const dest=allC().filter(x=>x!==C).flatMap(x=>x.gs.map(g=>[g,x.c]));
  if((np||nt)&&!dest.length)return '<p class="p" style="margin:8px 0 0">Não há outra congregação para receber as pessoas desta cidade.</p>';
  const vc=[np?`${np} ${np===1?'pessoa':'pessoas'}`:'',nt?`${nt} ${nt===1?'turma':'turmas'}`:''].filter(Boolean).join(' e ');
  const sel=vc?`<label>Transferir ${vc} para</label><select class="dxt">${dest.map(([g,c])=>`<option value="${esc(g)}">${esc(g)} (${esc(c)})</option>`).join('')}</select>`:'';
  return dxArea('ci:'+key,'Excluir cidade',`Excluir ${esc(C.c)}?`,`${C.gs.length?`As ${C.gs.length} congregações dela serão excluídas. `:''}${vc?`${vc} ${np+nt===1?'vai':'vão'} para ${esc(DXT)}. `:''}${nc?`${nc} ${nc===1?'campanha será excluída':'campanhas serão excluídas'}. `:''}${C.gst?`${esc(C.gst.n)} deixa de ser gestor, mas continua em Usuários. `:''}`,sel);
}

document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('ecpf'))t.value=cpfMask(t.value);if(t.classList.contains('etel'))t.value=telMask(t.value)});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const D=b.dataset,d=b.closest('details');
  const q=c=>d.querySelector('.'+c),val=c=>q(c)?q(c).value.trim():'';
  if(D.dx){DX=D.dx;const s=d&&d.querySelector('.dxt');DXT=s?s.value:'';render(1)}
  else if(D.dxno){DX=null;render(1)}
  else if(D.dxok){
    const [kd,...r]=DX.split(':'),i=+r[0];let msg='';
    if(kd==='p'){msg=`${PS[i].n} foi excluída.`;PS.splice(i,1)}
    else if(kd==='cp'){const n=CP[i].n;EVT=EVT.filter(x=>x.ca!==n);CP.splice(i,1);msg='Campanha excluída.'}
    else if(kd==='ev'){EV.splice(i,1);msg='Evento excluído.'}
    else if(kd==='tu'){const t=TU[i];AU.filter(a=>a.tu===i).forEach(a=>{EV=EV.filter(x=>x.t!==a.t)});AU=AU.filter(a=>a.tu!==i).map(a=>({...a,tu:a.tu>i?a.tu-1:a.tu}));TU.splice(i,1);msg=`Turma "${t.n}" excluída.`}
    else if(kd==='au'){const a=AU[i];EV=EV.filter(x=>x.t!==a.t);AU.splice(i,1);msg='Aula excluída.'}
    else if(kd==='et'){const e=EVT[i];EV=EV.filter(x=>x.t!==e.n);EVT.splice(i,1);msg='Evento excluído e retirado da agenda.'}
    else if(kd==='u'){const u=US[i];TU.forEach(t=>{if(t.pr===u.n)t.pr=''});Object.values(CI).forEach(x=>{if(x.resp===u.n)x.resp=''});allC().forEach(C=>{if(C.gst&&C.gst.n===u.n)C.gst=null;if(C.pg===u.n)C.pg=null});US.splice(i,1);msg=`${u.n} foi excluído e perdeu o acesso.`}
    else if(kd==='pa'){msg=`${GEO[i].p} foi excluído.`;GEO.splice(i,1);OPN={}}
    else if(kd==='es'){const P=GEO[i];msg=`${P.es[+r[1]].e} foi excluído.`;P.es.splice(+r[1],1);OPN={}}
    else if(kd==='ci'){const E=GEO[i].es[+r[1]],C=E.cs[+r[2]];
      if(DXT){PS.forEach(p=>{if(C.gs.includes(p.c))p.c=DXT});TU.forEach(t=>{if(C.gs.includes(t.g))t.g=DXT})}
      C.gs.forEach(g=>delete CI[g]);CP=CP.filter(c=>c.ci!==C.c);E.cs.splice(+r[2],1);OPN={};msg=`${C.c} foi excluída${DXT?'. As pessoas foram para '+DXT:''}.`}
    DX=null;DXT='';render(1);toast(msg);
  }
  else if(D.pe){
    const p=PS[+D.pe],o={n:val('en'),tel:val('etel'),cpf:val('ecpf'),rua:val('erua'),num:val('enum')},er=pCheck(o,p),eb=q('err');
    if(er.length){eb.innerHTML='<b>Falta corrigir:</b><ul>'+er.map(x=>`<li>${x}</li>`).join('')+'</ul>';eb.style.display='block';return}
    Object.assign(p,o,{c:val('econg'),o:val('eorig'),bai:val('ebai'),com:val('ecom'),obs:val('eobs'),st:+val('est')});if(q('efx')&&q('efx').checked)p.f=null;
    render(1);toast('Cadastro atualizado.');
  }
  else if(D.tue){const t=TU[+D.tue],nn=val('xtn');if(nn.length<3){toast('Informe o nome da turma.');return}Object.assign(t,{n:nn,g:val('xtg'),pr:val('xtp')});render(1);toast('Turma atualizada.')}
  else if(D.aue){const a=AU[+D.aue],dd=val('xad');if(!dd){toast('Informe a data da aula.');return}const ot=a.t;EV=EV.filter(x=>x.t!==ot);Object.assign(a,{t:val('xat'),tu:+val('xau'),d:dd});addEv(dd,a.t,'aula');render(1);toast('Aula atualizada.')}
  else if(D.ete){const e=EVT[+D.ete],nn=val('xen'),dd=val('xed');if(nn.length<3||!dd){toast('Informe o nome e a data do evento.');return}EV=EV.filter(x=>x.t!==e.n);Object.assign(e,{n:nn,ca:val('xec'),ty:val('xety'),d:dd,l:val('xel')});addEv(dd,nn,'campanha');render(1);toast('Evento atualizado.')}
  else if(D.pre){const u=US[+D.pre],nn=val('xpn');if(nn.length<3){toast('Informe o nome.');return}if(nn!==u.n&&uS(nn)){toast('Já existe um usuário com esse nome.');return}TU.forEach(t=>{if(t.pr===u.n)t.pr=nn});u.n=nn;u.cg=val('xpc');render(1);toast('Professor atualizado.')}
  else if(D.cpe){
    const c=CP[+D.cpe],nn=val('cn'),dd=val('cd');if(nn.length<3||!dd){toast('Informe o nome e a data de início.');return}
    EVT.forEach(x=>{if(x.ca===c.n)x.ca=nn});Object.assign(c,{n:nn,ty:val('cty'),d:dd,ab:val('cab')});render(1);toast('Campanha atualizada.');
  }
  else if(D.eve){
    const ev=EV[+D.eve],ti=val('vt'),dd=+val('vd');if(!ti||dd<1||dd>30){toast('Informe um título e um dia entre 1 e 30.');return}
    Object.assign(ev,{t:ti,ty:val('vty'),d:dd});render(1);toast('Evento atualizado.');
  }
  else if(D.ue){
    const u=US[+D.ue],nn=val('un'),m=val('um');
    if(nn.length<3){toast('Informe o nome.');return}if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast('O e-mail não parece válido.');return}
    if(nomeUsado(nn,u)){toast('Já existe um usuário com esse nome.');return}
    const mud=m&&m!==u.m;uRen(u.n,nn);Object.assign(u,{n:nn,m,cg:val('ucg')});render(1);toast(mud?'Usuário atualizado. O login passa a ser o novo e-mail, e um aviso foi enviado para ele.':'Usuário atualizado.');
  }
  else if(D.geo){
    const [kd,...r]=D.geo.split(':'),k=r.map(Number),nn=b.closest('.lk').querySelector('.gnn').value.trim();
    if(nn.length<2){toast('Digite o nome.');return}
    if(kd==='pa'){if(GEO.some((P,j)=>j!==k[0]&&P.p.toLowerCase()===nn.toLowerCase())){toast('Esse país já existe.');return}GEO[k[0]].p=nn}
    else if(kd==='es'){const P=GEO[k[0]];if(P.es.some((E,j)=>j!==k[1]&&E.e.toLowerCase()===nn.toLowerCase())){toast('Esse estado já existe neste país.');return}P.es[k[1]].e=nn}
    else{const E=GEO[k[0]].es[k[1]],C=E.cs[k[2]];if(E.cs.some((x,j)=>j!==k[2]&&x.c.toLowerCase()===nn.toLowerCase())){toast('Essa cidade já existe neste estado.');return}CP.forEach(c=>{if(c.ci===C.c)c.ci=nn});if(MYCID===C.c)MYCID=nn;C.c=nn}
    render(1);toast('Nome alterado.');
  }
  else if(D.gx){const k=D.gx.split(':').map(Number),C=GEO[k[0]].es[k[1]].cs[k[2]],n=C.gst.n;C.gst=null;render(1);toast(`${n} deixou de ser gestor da cidade. Ele continua em Usuários.`)}
},true);

    h+='<div class="card"><h2>Do convertido ao batismo</h2>'+S.map((v,i)=>`<div class="fs" style="--k:${CK[i]}"><div><span>${nm[i]}</span><b>${v}</b></div><div class="tr"><i style="--w:${pc(v,S[0])}%"></i></div></div>`).join('')+'</div>'}

  return `<div class="stu" role="dialog" aria-modal="true" aria-label="App do aluno">${head}<div class="stub">${body}</div>${nav}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset,d=b.closest('details');const v=c=>d&&d.querySelector('.'+c)?d.querySelector('.'+c).value.trim():'';
  if(D.alc){const n=$('#al_n').value.trim(),c=$('#al_c').value,tel=$('#al_t').value.trim(),ti=+$('#al_u').value;if(n.split(/\s+/).length<2){toast('Digite o nome completo.');return}if(c.replace(/\D/g,'').length!==11){toast('Digite um CPF com 11 números.');return}if(PS.some(x=>x.cpf===cpfMask(c))){toast('Já existe um aluno com este CPF.');return}
    const sp=spGen();PS.push({n,c:TU[ti].g,st:1,cpf:cpfMask(c),tel,acc:'prov',sp});tnz(TU[ti]).al.push(n);render(1);toast(`${n} cadastrado. Senha provisória: ${sp}.`)}
  else if(D.aac){const q=PS[+D.aac],c=v('xa_c');if(c.replace(/\D/g,'').length!==11){toast('Digite um CPF com 11 números.');return}Object.assign(q,{cpf:cpfMask(c),tel:v('xa_tel')||q.tel,acc:'prov',sp:spGen(),sent:0});render(1);toast(`Acesso criado. Senha provisória: ${q.sp}.`)}
  else if(D.anp){const q=PS[+D.anp];Object.assign(q,{acc:'prov',sp:spGen(),sent:0});render(1);toast(`Nova senha provisória: ${q.sp}. A anterior parou de funcionar.`)}
  else if(D.alu){stuOpen(D.alu,'app')}
  else if(D.alg){stuOpen(D.alg,'login')}
  else if(D.stx){STU=null;ovl()}
  else if(D.stl){const q=PS.find(x=>x.n===STU.n);STU.step=q&&q.acc==='prov'?'nova':'app';ovl()}
  else if(D.stn){const a=$('#stp1').value,c=$('#stp2').value;if(a.length<6){toast('A senha precisa de pelo menos 6 caracteres.');return}if(a!==c){toast('As senhas não são iguais.');return}const q=PS.find(x=>x.n===STU.n);q.acc='ativo';q.sp=null;STU.step='app';render(1);toast('Senha criada. Bem-vindo(a)!')}
  else if(D.stt){STU.tab=D.stt;STU.a=null;ovl()}
  else if(D.sta){STU.a=+D.sta<0?null:+D.sta;STU.k=0;ovl()}
  else if(D.stk){STU.k+=+D.stk;ovl()}
  else if(D.stv)toast('O vídeo abre em tela cheia.')
  else if(D.stlive)toast('Você entrou na live. Quando o professor fizer a chamada, toque em "Estou presente".')
  else if(D.stsend){const ti=+D.stsend,t=TU[ti],qs=PLA[t.pl].pv.qs;let c=0,miss=0;qs.forEach((x,k)=>{const r=document.querySelector(`#ovl input[name="sq${k}"]:checked`);if(!r)miss++;else if(+r.value===x.c)c++});if(miss){toast(`Faltam ${miss} ${miss===1?'questão':'questões'}.`);return}const nt=Math.round(c/qs.length*20)/2;t.nt[STU.n]=nt;render(1);ovl()}
  else if(D.stdip){DIP={ti:+D.stdip,n:STU.n};ovl()}
});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-asent]');if(!a)return;PS[+a.dataset.asent].sent=1;setTimeout(()=>render(1),50);toast('Acesso enviado pelo WhatsApp.')});
</script>
